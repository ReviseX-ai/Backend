<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generated Questions - BharatGen</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.1.0/github-markdown.min.css">
    <!-- Add MathJax configuration -->
    <script type="text/x-mathjax-config">
      MathJax.Hub.Config({
        tex2jax: {
          inlineMath: [['$','$'], ['\\(','\\)']],
          displayMath: [['$$','$$'], ['\\[','\\]']],
          processEscapes: true,
          processEnvironments: true
        },
        TeX: { 
          equationNumbers: { autoNumber: "AMS" },
          extensions: ["AMSmath.js", "AMSsymbols.js"]
        },
        "HTML-CSS": { 
          availableFonts: ["TeX"],
          scale: 100,
          linebreaks: { automatic: true }
        },
        SVG: { linebreaks: { automatic: true } }
      });
    </script>
    <script type="text/javascript" async
      src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.7/MathJax.js?config=TeX-MML-AM_CHTML">
    </script>
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .container {
            max-width: 900px;
            margin-top: 30px;
            margin-bottom: 50px;
            background-color: #fff;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }
        .questions-heading {
            color: #2c3e50;
            margin-bottom: 20px;
            text-align: center;
        }
        .questions-metadata {
            color: #7f8c8d;
            margin-bottom: 30px;
            text-align: center;
        }
        .markdown-body {
            padding: 20px;
            border-radius: 5px;
            background-color: #000000;
            color: #ffffff;
        }
        .markdown-body h1, 
        .markdown-body h2, 
        .markdown-body h3, 
        .markdown-body h4, 
        .markdown-body h5, 
        .markdown-body h6, 
        .markdown-body strong {
            color: #ffffff;
        }
        .markdown-body pre, 
        .markdown-body code {
            background-color: #333;
            color: #f8f9fa;
        }
        /* Improve math rendering */
        .MathJax_Display {
            overflow-x: auto;
            overflow-y: hidden;
            padding: 0.5em 0;
        }
        .MathJax {
            color: #fff !important;
        }
        .MathJax_SVG_Display {
            overflow-x: auto;
            overflow-y: hidden;
        }
        .markdown-body .MathJax_Display {
            margin: 0.5em 0;
            background-color: transparent !important;
        }
        /* Ensure proper alignment of math expressions */
        .markdown-body p {
            overflow-x: auto;
        }
        @media print {
            .no-print {
                display: none !important;
            }
            .container {
                box-shadow: none;
                max-width: 100%;
                margin: 0;
                padding: 0;
            }
            .markdown-body {
                padding: 0;
                background-color: white;
                color: black;
            }
            .markdown-body h1, 
            .markdown-body h2, 
            .markdown-body h3, 
            .markdown-body h4, 
            .markdown-body h5, 
            .markdown-body h6, 
            .markdown-body strong {
                color: black;
            }
            .MathJax {
                color: #000 !important;
            }
        }
        .action-buttons {
            margin-top: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center; /* Add this to align items vertically */
            flex-wrap: nowrap; /* Prevent wrapping to new lines */
        }
        
        /* Add responsive adjustments for mobile devices */
        @media (max-width: 576px) {
            .action-buttons {
                flex-direction: column;
                gap: 10px;
            }
            
            .action-buttons > * {
                width: 100%;
            }
            
            .action-buttons-right {
                display: flex;
                justify-content: space-between;
                width: 100%;
            }
        }
        
        /* Style for the right side button container */
        .action-buttons-right {
            display: flex;
            gap: 10px; /* Add space between buttons */
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="no-print">
            <h1 class="questions-heading">Generated Questions</h1>
            <div id="questionMetadata" class="questions-metadata"></div>
            
            <div class="action-buttons">
                <a href="/" class="btn btn-secondary">← Back to Generator</a>
                <div class="action-buttons-right">
                    <button class="btn btn-primary" onclick="printQuestions()">Print Questions</button>
                    <button class="btn btn-success" onclick="downloadPDF()">Download PDF</button>
                </div>
            </div>
            
            <div id="printTips" class="print-tips">
                <h5>Printing Tips:</h5>
                <ul>
                    <li>Set paper orientation to Portrait</li>
                    <li>Enable "Background Graphics" in browser print settings for better formatting</li>
                    <li>Use "Save as PDF" option if available for best results</li>
                </ul>
                <button class="btn btn-sm btn-outline-primary mt-2" onclick="window.print()">Continue to Print</button>
            </div>
        </div>
        
        <div id="questionsContainer" class="markdown-body mt-4"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.0.2/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Retrieve generated questions from local storage
            const markdown = localStorage.getItem('generatedQuestions');
            const metadataStr = localStorage.getItem('questionMetadata');
            
            if (!markdown) {
                document.getElementById('questionsContainer').innerHTML = 
                    '<div class="alert alert-warning">No generated questions found. Please go back and generate new questions.</div>';
                return;
            }
            
            // Display the markdown content
            document.getElementById('questionsContainer').innerHTML = marked.parse(markdown);
            
            // Trigger MathJax to render the math expressions
            if (typeof MathJax !== 'undefined') {
                MathJax.Hub.Queue(["Typeset", MathJax.Hub, "questionsContainer"]);
            }
            
            // Display metadata if available
            if (metadataStr) {
                try {
                    const metadata = JSON.parse(metadataStr);
                    const examType = metadata.exam.toUpperCase();
                    const subject = metadata.subject.charAt(0).toUpperCase() + metadata.subject.slice(1);
                    const topics = metadata.topics.join(', ');
                    
                    document.getElementById('questionMetadata').innerHTML = 
                        `<strong>${examType}</strong> | <strong>${subject}</strong> | ${metadata.numQuestions} questions<br>
                        <small>Topics: ${topics}</small>`;
                    
                    // Update document title
                    document.title = `${examType} ${subject} Questions - BharatGen`;
                } catch (e) {
                    console.error('Error parsing metadata:', e);
                }
            }
        });
        
        function printQuestions() {
            // Show print tips
            document.getElementById('printTips').style.display = 'block';
            
            // Scroll to print tips
            document.getElementById('printTips').scrollIntoView({ behavior: 'smooth' });
        }
        
        function downloadPDF() {
            // Wait for MathJax to finish rendering
            if (typeof MathJax !== 'undefined') {
                MathJax.Hub.Queue(function() {
                    generatePDF();
                });
            } else {
                generatePDF();
            }
            
            function generatePDF() {
                const element = document.getElementById('questionsContainer');
                const metadataStr = localStorage.getItem('questionMetadata');
                let filename = 'generated-questions.pdf';
                
                if (metadataStr) {
                    try {
                        const metadata = JSON.parse(metadataStr);
                        filename = `${metadata.exam.toUpperCase()}_${metadata.subject}_questions.pdf`;
                    } catch (e) {
                        console.error('Error parsing metadata for filename:', e);
                    }
                }
                
                const opt = {
                    margin: [10, 10, 10, 10],
                    filename: filename,
                    image: { type: 'jpeg', quality: 0.98 },
                    html2canvas: { scale: 2 },
                    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
                };
                
                // Add metadata as a header
                const header = document.createElement('div');
                header.innerHTML = document.getElementById('questionMetadata').innerHTML;
                header.style.textAlign = 'center';
                header.style.marginBottom = '20px';
                header.style.padding = '10px';
                header.style.borderBottom = '1px solid #ddd';
                
                element.insertBefore(header, element.firstChild);
                
                // Generate PDF
                html2pdf().set(opt).from(element).save().then(() => {
                    // Remove the header after PDF generation
                    element.removeChild(element.firstChild);
                });
            }
        }
    </script>
</body>
</html>
