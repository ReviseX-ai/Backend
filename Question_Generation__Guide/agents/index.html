<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BharatGen Question Generator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .container {
            max-width: 800px;
            margin-top: 50px;
            background-color: #fff;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }
        .btn-exam {
            width: 100%;
            margin-bottom: 10px;
            padding: 15px;
            font-size: 18px;
            transition: all 0.3s;
        }
        .btn-subject {
            width: 100%;
            margin-bottom: 10px;
            padding: 12px;
            transition: all 0.3s;
        }
        .active-btn {
            box-shadow: 0 0 10px rgba(0,123,255,0.5);
            transform: scale(1.05);
        }
        .section {
            margin-bottom: 30px;
            padding: 20px;
            border-radius: 10px;
            background-color: #f8f9fa;
        }
        .select2-container {
            width: 100% !important;
        }
        .loading {
            display: none;
            margin: 20px auto;
            text-align: center;
        }
        .spinner-border {
            width: 3rem;
            height: 3rem;
        }
        .generator-heading {
            color: #2c3e50;
            margin-bottom: 30px;
            text-align: center;
        }
        .generator-subtitle {
            color: #7f8c8d;
            margin-bottom: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="generator-heading">BharatGen Question Generator</h1>
        <p class="generator-subtitle">Generate personalized practice questions for JEE and NEET preparation</p>
        
        <div id="examSection" class="section">
            <h3>Step 1: Choose Exam</h3>
            <div class="row">
                <div class="col-md-6">
                    <button id="jeeBtn" class="btn btn-primary btn-exam" onclick="selectExam('jee')">JEE</button>
                </div>
                <div class="col-md-6">
                    <button id="neetBtn" class="btn btn-success btn-exam" onclick="selectExam('neet')">NEET</button>
                </div>
            </div>
        </div>
        
        <div id="subjectSection" class="section" style="display: none;">
            <h3>Step 2: Choose Subject</h3>
            <div id="jeeSubjects" class="row" style="display: none;">
                <div class="col-md-4">
                    <button class="btn btn-outline-primary btn-subject" onclick="selectSubject('physics')">Physics</button>
                </div>
                <div class="col-md-4">
                    <button class="btn btn-outline-primary btn-subject" onclick="selectSubject('chemistry')">Chemistry</button>
                </div>
                <div class="col-md-4">
                    <button class="btn btn-outline-primary btn-subject" onclick="selectSubject('mathematics')">Mathematics</button>
                </div>
            </div>
            <div id="neetSubjects" class="row" style="display: none;">
                <div class="col-md-4">
                    <button class="btn btn-outline-success btn-subject" onclick="selectSubject('physics')">Physics</button>
                </div>
                <div class="col-md-4">
                    <button class="btn btn-outline-success btn-subject" onclick="selectSubject('chemistry')">Chemistry</button>
                </div>
                <div class="col-md-4">
                    <button class="btn btn-outline-success btn-subject" onclick="selectSubject('biology')">Biology</button>
                </div>
            </div>
        </div>
        
        <div id="topicsSection" class="section" style="display: none;">
            <h3>Step 3: Select Topics/Chapters</h3>
            <div class="form-group mb-4">
                <label for="topicsSelect">Choose one or more topics (hold Ctrl/Cmd to select multiple):</label>
                <select id="topicsSelect" class="form-control" multiple style="width: 100%;">
                    <!-- Topics will be populated based on subject selection -->
                </select>
            </div>
            
            <div class="form-group mb-4">
                <label for="numQuestions">Number of Questions:</label>
                <input type="number" id="numQuestions" class="form-control" min="1" max="20" value="10">
            </div>
            
            <button id="generateBtn" class="btn btn-lg btn-primary w-100" onclick="generateQuestions()">Generate Questions</button>
        </div>
        
        <div id="loadingSection" class="loading">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p class="mt-3">Generating questions... This may take a minute or two.</p>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <script>
        // Global variables
        let selectedExam = '';
        let selectedSubject = '';
        
        // Topic mappings by subject
        const topics = {
            physics: {
                jee: [
                    'Mechanics', 'Kinematics', 'Laws of Motion', 'Work, Energy and Power', 
                    'Rotational Motion', 'Gravitation', 'Properties of Solids and Liquids', 
                    'Thermodynamics', 'Kinetic Theory of Gases', 'Oscillations and Waves', 
                    'Electrostatics', 'Current Electricity', 'Magnetic Effects of Current', 
                    'Electromagnetic Induction', 'Alternating Current', 'Electromagnetic Waves', 
                    'Optics', 'Dual Nature of Matter and Radiation', 'Atoms and Nuclei', 
                    'Electronic Devices', 'Communication Systems'
                ],
                neet: [
                    'Physical World and Measurement', 'Kinematics', 'Laws of Motion', 
                    'Work, Energy and Power', 'Rotational Motion', 'Gravitation', 
                    'Properties of Solids and Liquids', 'Thermodynamics', 'Kinetic Theory of Gases', 
                    'Oscillations and Waves', 'Electrostatics', 'Current Electricity', 
                    'Magnetic Effects of Current', 'Electromagnetic Induction', 'Alternating Current', 
                    'Electromagnetic Waves', 'Optics', 'Dual Nature of Matter and Radiation', 
                    'Atoms and Nuclei', 'Electronic Devices'
                ]
            },
            chemistry: {
                jee: [
                    'Some Basic Concepts of Chemistry', 'Structure of Atom', 'Classification of Elements', 
                    'Chemical Bonding and Molecular Structure', 'States of Matter', 'Thermodynamics', 
                    'Equilibrium', 'Redox Reactions', 'Hydrogen', 's-Block Elements', 'p-Block Elements', 
                    'Organic Chemistry - Basic Principles', 'Hydrocarbons', 'Environmental Chemistry', 
                    'Solid State', 'Solutions', 'Electrochemistry', 'Chemical Kinetics', 
                    'Surface Chemistry', 'd and f Block Elements', 'Coordination Compounds', 
                    'Haloalkanes and Haloarenes', 'Alcohols, Phenols and Ethers', 
                    'Aldehydes, Ketones and Carboxylic Acids', 'Amines', 'Biomolecules', 
                    'Polymers', 'Chemistry in Everyday Life'
                ],
                neet: [
                    'Some Basic Concepts of Chemistry', 'Structure of Atom', 'Classification of Elements', 
                    'Chemical Bonding and Molecular Structure', 'States of Matter', 'Thermodynamics', 
                    'Equilibrium', 'Redox Reactions', 'Hydrogen', 's-Block Elements', 'p-Block Elements', 
                    'Organic Chemistry - Basic Principles', 'Hydrocarbons', 'Environmental Chemistry', 
                    'Solid State', 'Solutions', 'Electrochemistry', 'Chemical Kinetics', 
                    'Surface Chemistry', 'd and f Block Elements', 'Coordination Compounds', 
                    'Haloalkanes and Haloarenes', 'Alcohols, Phenols and Ethers', 
                    'Aldehydes, Ketones and Carboxylic Acids', 'Amines', 'Biomolecules', 
                    'Polymers', 'Chemistry in Everyday Life'
                ]
            },
            mathematics: {
                jee: [
                    'Sets, Relations and Functions', 'Complex Numbers and Quadratic Equations', 
                    'Matrices and Determinants', 'Permutations and Combinations', 'Mathematical Induction', 
                    'Binomial Theorem', 'Sequences and Series', 'Limit, Continuity and Differentiability', 
                    'Integral Calculus', 'Differential Equations', 'Coordinate Geometry', 
                    'Three Dimensional Geometry', 'Vector Algebra', 'Statistics and Probability', 
                    'Trigonometry', 'Mathematical Reasoning'
                ]
            },
            biology: {
                neet: [
                    'Diversity in Living World', 'Structural Organisation in Animals and Plants', 
                    'Cell Structure and Function', 'Plant Physiology', 'Human Physiology', 
                    'Reproduction', 'Genetics and Evolution', 'Biology and Human Welfare', 
                    'Biotechnology and its Applications', 'Ecology and Environment'
                ]
            }
        };
        
        // Initialize Select2
        $(document).ready(function() {
            $('#topicsSelect').select2({
                placeholder: "Select topics/chapters",
                allowClear: true
            });
        });
        
        // Exam selection handler
        function selectExam(exam) {
            selectedExam = exam;
            
            // Update UI for exam buttons
            $('#jeeBtn, #neetBtn').removeClass('active-btn');
            
            if (exam === 'jee') {
                $('#jeeBtn').addClass('active-btn');
                $('#jeeSubjects').show();
                $('#neetSubjects').hide();
            } else {
                $('#neetBtn').addClass('active-btn');
                $('#neetSubjects').show();
                $('#jeeSubjects').hide();
            }
            
            // Show subject section
            $('#subjectSection').show();
            
            // Reset subject and topics
            selectedSubject = '';
            $('#topicsSelect').empty();
            $('#topicsSection').hide();
        }
        
        // Subject selection handler
        function selectSubject(subject) {
            selectedSubject = subject;
            
            // Update UI for subject buttons
            $('.btn-subject').removeClass('active-btn');
            $(event.target).addClass('active-btn');
            
            // Populate topics dropdown based on exam and subject
            populateTopics();
            
            // Show topics section
            $('#topicsSection').show();
        }
        
        // Populate topics based on exam and subject
        function populateTopics() {
            const topicList = topics[selectedSubject]?.[selectedExam] || [];
            $('#topicsSelect').empty();
            
            topicList.forEach(topic => {
                $('#topicsSelect').append(new Option(topic, topic));
            });
        }
        
        // Generate questions handler
        function generateQuestions() {
            const selectedTopics = $('#topicsSelect').val();
            const numQuestions = $('#numQuestions').val();
            
            if (!selectedExam || !selectedSubject || !selectedTopics || selectedTopics.length === 0) {
                alert('Please select exam, subject, and at least one topic');
                return;
            }
            
            // Show loading indicator
            $('#loadingSection').show();
            $('#generateBtn').prop('disabled', true);
            
            // Prepare request data
            const requestData = {
                exam_type: selectedExam,
                subject: selectedSubject,
                chapters: selectedTopics,
                num_questions: parseInt(numQuestions)
            };
            
            // Call API to generate questions
            fetch('/api/generate_questions', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(requestData)
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                return response.json();
            })
            .then(data => {
                if (data.success) {
                    // Redirect to results page with the generated content
                    localStorage.setItem('generatedQuestions', data.markdown);
                    localStorage.setItem('questionMetadata', JSON.stringify({
                        exam: selectedExam,
                        subject: selectedSubject,
                        topics: selectedTopics,
                        numQuestions: numQuestions
                    }));
                    window.location.href = '/results.html';
                } else {
                    throw new Error('Failed to generate questions');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Error generating questions. Please try again.');
                $('#loadingSection').hide();
                $('#generateBtn').prop('disabled', false);
            });
        }
    </script>
</body>
</html>
